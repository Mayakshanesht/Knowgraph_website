<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Knowgraph mark: a concept cluster with one focused node.
       Rebuilt as vector from the raster logo: transparent background,
       no baked-in padding, and edges that survive on dark surfaces. -->
  <defs>
    <linearGradient id="focus" x1="34" y1="38" x2="82" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC542"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A6479"/>
      <stop offset="1" stop-color="#3D4657"/>
    </linearGradient>
  </defs>

  <g stroke="#8A93A5" stroke-opacity="0.55" stroke-width="3.2" stroke-linecap="round">
    <path d="M26 38 L74 30"/>
    <path d="M74 30 L100 58"/>
    <path d="M26 38 L34 92"/>
  </g>
  <g stroke="#4B5565" stroke-width="3.6" stroke-linecap="round">
    <path d="M26 38 L58 62"/>
    <path d="M74 30 L58 62"/>
    <path d="M34 92 L58 62"/>
    <path d="M58 62 L100 58"/>
  </g>

  <circle cx="26" cy="38" r="12" fill="url(#node)"/>
  <circle cx="74" cy="30" r="11" fill="#1B5FBF"/>
  <circle cx="34" cy="92" r="12" fill="#4CAF2F"/>
  <circle cx="100" cy="58" r="7.5" fill="url(#node)"/>
  <circle cx="58" cy="62" r="22" fill="url(#focus)"/>
</svg>
